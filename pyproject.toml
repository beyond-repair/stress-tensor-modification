[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stress-tensor-modification"
version = "0.1.0"
description = "Maxwell stress and toy BEM diagnostics on an open 0.45 gasket. Not a thrust claim."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "All Rights Reserved" }
authors = [{ name = "Brian Ware" }]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
stress-tensor-modification = "cli:main"

[tool.setuptools]
py-modules = [
  "physics_evaluator",
  "physics_evaluator_snippet",
  "local_geometry",
  "closure",
  "bem_sierpinski",
  "rf_bem_sierpinski",
  "fullwave_bem",
  "couple_sierpinski_evaluator",
  "cli",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
